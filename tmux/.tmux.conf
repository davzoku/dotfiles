
### Dracula core style
set -g @dracula-show-powerline true

### Monokai color overrides (replaces Dracula palette via eval in dracula.sh)
set -g @dracula-colors "white='#F8F8F2' gray='#272822' dark_gray='#272822' dark_purple='#cf7c1d' cyan='#66D9EF' green='#63915a' orange='#FD971F' red='#F92672' pink='#F92672' yellow='#E6DB74' purple='#AE81FF'"
set -g @dracula-border-contrast true

set -g @dracula-plugins "git network-public-ip time"
set -g @dracula-show-left-icon "#S"

set-option -sa terminal-overrides ",xterm*:Tc"
unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

set -g pane-border-style fg=colour22
set -g pane-active-border-style fg=colour46

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# Vim movement between panes (prefix + vi)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Free C-j for the shell (ble.sh accept-line); prefix+j still selects the pane below
set -g @vim_navigator_mapping_down ''

set -g @plugin 'dracula/tmux'

run '~/.tmux/plugins/tpm/tpm'
# Restore neon green dividers — dracula.sh overrides pane-border-style during plugin init
run-shell "tmux set-option -g pane-border-style 'fg=colour22' && tmux set-option -g pane-active-border-style 'fg=colour46'"
